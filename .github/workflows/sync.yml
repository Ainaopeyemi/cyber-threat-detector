name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # The --force flag will overwrite the "pre-receive hook declined" error
        run: git push --force https://Ainaopeyemi:$HF_TOKEN@huggingface.co/spaces/Nishola/cyber-threat-detector main
